name: Release DBX plugin

# Builds the unsigned candidate on every supported platform and attaches the
# artifacts to a GitHub Release — the store candidate then points at those
# assets. Publishing a Release triggers this automatically; a manual dispatch
# targets an existing Release by tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Tag of an existing GitHub Release that receives the assets
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@plugin-cli-v0.1.6
    with:
      release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
      package-command: corepack enable && corepack pnpm --dir ui install --frozen-lockfile && corepack pnpm --dir ui run build && dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.6
      # One job per platform the store candidate ships for.
      build-matrix: >-
        {"include":[{"runner":"ubuntu-24.04","target":"linux-x64"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64"},{"runner":"windows-11-arm","target":"windows-arm64"},{"runner":"windows-2022","target":"windows-x64"},{"runner":"macos-15-intel","target":"darwin-x64"},{"runner":"macos-15","target":"darwin-arm64"}]}
